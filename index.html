<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#C9184A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Nails Studio — Gestión de Negocio</title>

<!-- ============================================================
     MANIFEST PWA (embebido como Blob para mantener un solo archivo)

<link rel="icon" id="app-favicon">
<link rel="apple-touch-icon" id="app-apple-icon">

<!-- Fuentes: se cargan si hay conexión; si no, cae a las fuentes del sistema
     definidas en --font-display/--font-body sin romper el layout -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" onerror="this.remove()">

<style>
/* ============================================================
   1. TOKENS DE DISEÑO
   ============================================================
   Paleta inspirada en esmalte de uñas y mesa de trabajo de manicura:
   - Primario: rosa esmalte profundo (configurable por el usuario)
   - Acento: dorado champagne (detalles, favoritos, precios)
   - Fondo: blanco cálido con matiz rosado, no el cream genérico
   ============================================================ */
:root{
  /* Color primario y variantes (configurable desde Ajustes) */
  --primary:#C9184A;
  --primary-dark:#A11340;
  --primary-light:#F4C6D2;
  --primary-tint:#FDECF0;

  /* Acento dorado */
  --accent:#D4AF7A;
  --accent-dark:#B8935E;

  /* Neutros — tema claro */
  --bg:#FDF8F6;
  --surface:#FFFFFF;
  --surface-2:#FBF2EF;
  --border:#EDE1DC;
  --text:#2B2320;
  --text-soft:#6B5D57;
  --text-faint:#9C8C85;

  /* Semánticos */
  --success:#2D8659;
  --success-tint:#E6F4EC;
  --warning:#C9750A;
  --warning-tint:#FBEEDD;
  --danger:#C43D3D;
  --danger-tint:#FBEAEA;
  --info:#3D6FC4;
  --info-tint:#EAF0FB;

  /* Tipografía */
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:'DM Mono', 'SF Mono', monospace;

  /* Escala tipográfica */
  --text-xs:0.75rem;
  --text-sm:0.8125rem;
  --text-base:0.9375rem;
  --text-md:1.0625rem;
  --text-lg:1.25rem;
  --text-xl:1.5rem;
  --text-2xl:1.875rem;
  --text-3xl:2.375rem;

  /* Espaciado */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --sp-5:20px; --sp-6:24px; --sp-7:32px; --sp-8:40px; --sp-9:56px;

  /* Radios */
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-full:999px;

  /* Sombras — suaves, cálidas, nunca negro puro */
  --shadow-sm:0 1px 2px rgba(43,35,32,0.06), 0 1px 1px rgba(43,35,32,0.04);
  --shadow-md:0 4px 12px rgba(43,35,32,0.08), 0 2px 4px rgba(43,35,32,0.04);
  --shadow-lg:0 12px 28px rgba(43,35,32,0.12), 0 4px 8px rgba(43,35,32,0.04);
  --shadow-nav:0 -2px 16px rgba(43,35,32,0.08);

  /* Transiciones */
  --ease:cubic-bezier(0.22,1,0.36,1);
  --t-fast:150ms;
  --t-base:220ms;
  --t-slow:340ms;

  /* Layout */
  --nav-h:64px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --header-h:56px;

  /* Tamaño de texto global (ajustable en Configuración) */
  --text-scale:1;
}

/* Tema oscuro */
[data-theme="dark"]{
  --bg:#1A1513;
  --surface:#241D1A;
  --surface-2:#2C2422;
  --border:#3A302C;
  --text:#F2E9E5;
  --text-soft:#C4B5AE;
  --text-faint:#8A7B74;

  --primary-tint:#3A1A26;
  --success-tint:#153524;
  --warning-tint:#3A2810;
  --danger-tint:#3A1818;
  --info-tint:#16233A;

  --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
  --shadow-md:0 4px 12px rgba(0,0,0,0.35);
  --shadow-lg:0 12px 28px rgba(0,0,0,0.45);
  --shadow-nav:0 -2px 16px rgba(0,0,0,0.4);
}

*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  font-size:calc(var(--text-base) * var(--text-scale));
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background var(--t-base) var(--ease), color var(--t-base) var(--ease);
}
button{font-family:inherit; font-size:inherit; color:inherit; border:none; background:none; cursor:pointer; -webkit-tap-highlight-color:transparent;}
input,textarea,select{font-family:inherit; font-size:inherit; color:inherit;}
a{color:inherit; text-decoration:none;}
img{max-width:100%; display:block;}
::selection{background:var(--primary-light);}

/* Scrollbar discreto (desktop) */
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:var(--r-full);}

/* Foco visible — accesibilidad */
:focus-visible{outline:2px solid var(--primary); outline-offset:2px; border-radius:var(--r-sm);}

/* Reduced motion */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
}

/* ================================================================
   2. SHELL DE LA APLICACIÓN
   ================================================================ */
#app-root{min-height:100vh; display:flex; flex-direction:column;}

#app-header{
  height:calc(var(--header-h) + var(--safe-top));
  padding-top:var(--safe-top);
  display:flex; align-items:center; gap:var(--sp-2);
  padding-left:var(--sp-4); padding-right:var(--sp-4);
  background:var(--surface);
  border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:40;
}
#header-title{
  font-family:var(--font-display); font-weight:600; font-size:var(--text-lg);
  flex:1; letter-spacing:-0.01em;
}
.header-back{
  width:36px; height:36px; display:flex; align-items:center; justify-content:center;
  border-radius:var(--r-full); color:var(--text-soft);
  transition:background var(--t-fast);
}
.header-back:active{background:var(--surface-2);}
#header-actions{display:flex; align-items:center; gap:var(--sp-2);}

#view-container{
  flex:1;
  padding:var(--sp-4);
  padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + var(--sp-6));
  max-width:640px; width:100%; margin:0 auto;
  animation:view-enter var(--t-base) var(--ease);
}
@keyframes view-enter{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.view-loading{display:flex; justify-content:center; padding:var(--sp-9) 0;}
.spinner{
  width:28px; height:28px; border-radius:50%;
  border:3px solid var(--border); border-top-color:var(--primary);
  animation:spin 0.7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

#bottom-nav{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  height:calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);
  background:var(--surface);
  border-top:1px solid var(--border);
  box-shadow:var(--shadow-nav);
  display:flex; max-width:640px; margin:0 auto;
}
.bn-item{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; color:var(--text-faint); transition:color var(--t-fast), transform var(--t-fast);
  padding:6px 0;
}
.bn-item.active{color:var(--primary);}
.bn-item:active{transform:scale(0.92);}
.bn-icon{display:flex; transition:transform var(--t-fast) var(--ease);}
.bn-item.active .bn-icon{transform:translateY(-1px);}
.bn-label{font-size:10.5px; font-weight:600; letter-spacing:0.01em;}

/* ================================================================
   3. TOASTS
   ================================================================ */
#toast-container{
  position:fixed; top:calc(var(--safe-top) + 64px); left:0; right:0;
  display:flex; flex-direction:column; align-items:center; gap:8px;
  z-index:200; pointer-events:none; padding:0 var(--sp-4);
}
.toast{
  background:var(--text); color:var(--bg);
  padding:11px 18px; border-radius:var(--r-full);
  font-size:var(--text-sm); font-weight:500;
  display:flex; align-items:center; gap:8px;
  box-shadow:var(--shadow-lg);
  opacity:0; transform:translateY(-12px) scale(0.95);
  transition:all var(--t-base) var(--ease);
  max-width:100%;
}
.toast.show{opacity:1; transform:translateY(0) scale(1);}
.toast-success{background:var(--success);}
.toast-error{background:var(--danger);}

/* ================================================================
   4. MODALES / BOTTOM SHEETS
   ================================================================ */
.modal-overlay{
  position:fixed; inset:0; background:rgba(20,14,12,0.45);
  display:flex; align-items:flex-end; justify-content:center;
  z-index:100; opacity:0; transition:opacity var(--t-base) var(--ease);
  backdrop-filter:blur(2px);
}
.modal-overlay.show{opacity:1;}
.modal-sheet{
  background:var(--surface); width:100%; max-width:640px;
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  max-height:88vh; overflow-y:auto;
  padding:var(--sp-6) var(--sp-5) calc(var(--sp-6) + var(--safe-bottom));
  transform:translateY(100%); transition:transform var(--t-slow) var(--ease);
  box-shadow:0 -8px 40px rgba(0,0,0,0.2);
}
.modal-overlay.show .modal-sheet{transform:translateY(0);}
.modal-sheet.fullscreen{
  height:92vh; max-height:92vh; border-radius:var(--r-xl) var(--r-xl) 0 0;
}
.modal-sheet::before{
  content:''; display:block; width:36px; height:4px; background:var(--border);
  border-radius:var(--r-full); margin:0 auto var(--sp-5);
}

.confirm-dialog{text-align:center; padding:var(--sp-3) 0;}
.confirm-icon{
  width:52px; height:52px; border-radius:50%; background:var(--primary-tint); color:var(--primary);
  display:flex; align-items:center; justify-content:center; margin:0 auto var(--sp-4);
}
.confirm-icon.danger{background:var(--danger-tint); color:var(--danger);}
.confirm-dialog h3{font-family:var(--font-display); font-size:var(--text-lg); margin-bottom:var(--sp-2);}
.confirm-dialog p{color:var(--text-soft); font-size:var(--text-sm); margin-bottom:var(--sp-6); line-height:1.5;}
.confirm-actions{display:flex; gap:var(--sp-3);}
.confirm-actions .btn{flex:1;}

/* ================================================================
   5. BOTONES
   ================================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:13px 22px; border-radius:var(--r-md);
  font-weight:600; font-size:var(--text-base);
  transition:transform var(--t-fast), box-shadow var(--t-fast), opacity var(--t-fast), background var(--t-fast);
  white-space:nowrap;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--primary); color:#fff; box-shadow:var(--shadow-sm);}
.btn-primary:active{background:var(--primary-dark);}
.btn-secondary{background:var(--primary-tint); color:var(--primary-dark);}
.btn-ghost{background:var(--surface-2); color:var(--text);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-outline{background:transparent; border:1.5px solid var(--border); color:var(--text);}
.btn-block{width:100%;}
.btn-sm{padding:8px 14px; font-size:var(--text-sm); border-radius:var(--r-sm);}
.btn-icon{
  width:40px; height:40px; padding:0; border-radius:var(--r-full);
  background:var(--surface-2); color:var(--text-soft);
}
.btn-icon.primary{background:var(--primary-tint); color:var(--primary);}
.fab{
  position:fixed; right:var(--sp-5); bottom:calc(var(--nav-h) + var(--safe-bottom) + var(--sp-4));
  width:58px; height:58px; border-radius:var(--r-full);
  background:var(--primary); color:#fff;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 20px rgba(201,24,74,0.35);
  z-index:45; transition:transform var(--t-fast);
}
.fab:active{transform:scale(0.92);}

/* ================================================================
   6. TARJETAS (CARDS)
   ================================================================ */
.card{
  background:var(--surface); border-radius:var(--r-lg);
  padding:var(--sp-4); border:1px solid var(--border);
  box-shadow:var(--shadow-sm);
}
.card + .card{margin-top:var(--sp-3);}
.section-title{
  font-family:var(--font-display); font-size:var(--text-md); font-weight:600;
  margin:var(--sp-7) 0 var(--sp-3); display:flex; align-items:center; justify-content:space-between;
  letter-spacing:-0.01em;
}
.section-title:first-child{margin-top:0;}
.section-title .link{font-family:var(--font-body); font-size:var(--text-sm); font-weight:600; color:var(--primary);}

/* Elemento de firma: "gota de esmalte" — acento visual recurrente en
   tarjetas de servicio/producto, referenciando el mundo del salón */
.drop-accent{
  position:absolute; top:-6px; right:14px; width:22px; height:26px;
  color:var(--drop-color, var(--primary));
  filter:drop-shadow(0 2px 3px rgba(0,0,0,0.12));
}
.service-card,.product-card{
  position:relative; overflow:visible;
}

.stat-card{
  background:var(--surface); border-radius:var(--r-lg); padding:var(--sp-4);
  border:1px solid var(--border);
  display:flex; flex-direction:column; gap:4px;
}
.stat-card .stat-label{font-size:var(--text-xs); color:var(--text-faint); font-weight:600; text-transform:uppercase; letter-spacing:0.04em;}
.stat-card .stat-value{font-family:var(--font-display); font-size:var(--text-xl); font-weight:600;}
.stat-card .stat-usd{font-size:var(--text-xs); color:var(--text-faint);}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3);}

.dual-usd{color:var(--text-faint); font-size:0.85em; font-weight:500;}

.list-row{
  display:flex; align-items:center; gap:var(--sp-3);
  padding:var(--sp-3) 0; border-bottom:1px solid var(--border);
}
.list-row:last-child{border-bottom:none;}
.list-row-avatar{
  width:42px; height:42px; border-radius:var(--r-full); flex-shrink:0;
  background:var(--primary-tint); color:var(--primary-dark);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:var(--text-sm); overflow:hidden;
}
.list-row-avatar img{width:100%; height:100%; object-fit:cover;}
.list-row-body{flex:1; min-width:0;}
.list-row-title{font-weight:600; font-size:var(--text-base); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.list-row-sub{font-size:var(--text-sm); color:var(--text-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.list-row-end{text-align:right; flex-shrink:0;}

.empty-state{
  text-align:center; padding:var(--sp-9) var(--sp-5); color:var(--text-faint);
}
.empty-state .empty-icon{
  width:64px; height:64px; border-radius:50%; background:var(--surface-2);
  display:flex; align-items:center; justify-content:center; margin:0 auto var(--sp-4);
  color:var(--text-faint);
}
.empty-state h4{font-family:var(--font-display); color:var(--text); font-size:var(--text-md); margin-bottom:6px;}
.empty-state p{font-size:var(--text-sm); max-width:280px; margin:0 auto;}

.badge{
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 10px; border-radius:var(--r-full);
  font-size:var(--text-xs); font-weight:700; letter-spacing:0.01em;
}
.badge-success{background:var(--success-tint); color:var(--success);}
.badge-warning{background:var(--warning-tint); color:var(--warning);}
.badge-danger{background:var(--danger-tint); color:var(--danger);}
.badge-info{background:var(--info-tint); color:var(--info);}
.badge-neutral{background:var(--surface-2); color:var(--text-soft);}

/* ================================================================
   7. FORMULARIOS
   ================================================================ */
.field{margin-bottom:var(--sp-4);}
.field label{
  display:block; font-size:var(--text-sm); font-weight:600; color:var(--text-soft);
  margin-bottom:6px;
}
.field label .required{color:var(--danger);}
.field input,.field textarea,.field select{
  width:100%; padding:12px 14px; border-radius:var(--r-md);
  border:1.5px solid var(--border); background:var(--surface);
  transition:border-color var(--t-fast);
}
.field input:focus,.field textarea:focus,.field select:focus{
  border-color:var(--primary); outline:none;
}
.field textarea{resize:vertical; min-height:80px;}
.field-hint{font-size:var(--text-xs); color:var(--text-faint); margin-top:4px;}
.field-row{display:flex; gap:var(--sp-3);}
.field-row .field{flex:1;}

.chip-group{display:flex; gap:8px; flex-wrap:wrap;}
.chip{
  padding:8px 16px; border-radius:var(--r-full); border:1.5px solid var(--border);
  font-size:var(--text-sm); font-weight:600; color:var(--text-soft);
  transition:all var(--t-fast);
}
.chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}

.segmented{
  display:flex; background:var(--surface-2); border-radius:var(--r-md); padding:4px; gap:2px;
}
.segmented button{
  flex:1; padding:9px 0; border-radius:calc(var(--r-md) - 4px);
  font-size:var(--text-sm); font-weight:600; color:var(--text-soft);
  transition:all var(--t-fast);
}
.segmented button.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm);}

.search-bar{
  display:flex; align-items:center; gap:10px; background:var(--surface-2);
  border-radius:var(--r-full); padding:11px 16px; margin-bottom:var(--sp-4);
  color:var(--text-faint);
}
.search-bar input{flex:1; background:none; border:none; color:var(--text);}
.search-bar input:focus{outline:none;}

/* ================================================================
   8. DASHBOARD
   ================================================================ */
.dash-hero{
  background:linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  border-radius:var(--r-xl); padding:var(--sp-6);
  color:#fff; position:relative; overflow:hidden;
}
.dash-hero::after{
  content:''; position:absolute; right:-30px; top:-30px; width:140px; height:140px;
  border-radius:50%; background:rgba(255,255,255,0.08);
}
.dash-hero-label{font-size:var(--text-sm); opacity:0.85; font-weight:500;}
.dash-hero-value{font-family:var(--font-display); font-size:var(--text-3xl); font-weight:700; margin:4px 0; letter-spacing:-0.01em;}
.dash-hero-usd{font-size:var(--text-sm); opacity:0.85;}

.quick-grid{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3);}
.quick-btn{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:var(--sp-4); display:flex; flex-direction:column; align-items:center; gap:8px;
  color:var(--text); font-size:var(--text-sm); font-weight:600;
  transition:transform var(--t-fast), border-color var(--t-fast);
}
.quick-btn:active{transform:scale(0.96); border-color:var(--primary);}
.quick-btn svg{color:var(--primary);}

/* ================================================================
   9. AGENDA
   ================================================================ */
.agenda-nav{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:var(--sp-4);
}
.agenda-nav-label{font-family:var(--font-display); font-weight:600; text-transform:capitalize; font-size:var(--text-base);}
.agenda-day-label{font-size:var(--text-sm); font-weight:700; color:var(--text-soft); text-transform:capitalize; margin:var(--sp-4) 0 var(--sp-2);}
.agenda-day-label:first-child{margin-top:0;}

.appt-card{display:flex; align-items:center; gap:var(--sp-3); margin-bottom:8px; cursor:pointer;}
.appt-time{min-width:52px; text-align:center; color:var(--primary);}
.appt-body{flex:1; min-width:0;}

.month-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px;}
.month-dow{text-align:center; font-size:11px; font-weight:700; color:var(--text-faint); padding-bottom:6px;}
.month-cell{
  aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  border-radius:var(--r-sm); position:relative; cursor:pointer;
}
.month-cell.other-month{opacity:0.35;}
.month-cell.today .month-daynum{
  background:var(--primary); color:#fff; border-radius:50%;
  width:26px; height:26px; display:flex; align-items:center; justify-content:center;
}
.month-daynum{font-size:var(--text-sm); font-weight:600;}
.month-dot{width:5px; height:5px; border-radius:50%; background:var(--primary); margin-top:2px;}

/* ================================================================
   10. CATÁLOGO (servicios / productos)
   ================================================================ */
.cat-row{
  display:flex; justify-content:space-between; align-items:center;
  padding:12px 4px; border-bottom:1px solid var(--border); cursor:pointer;
  font-weight:600;
}
.subcat-services{padding:4px 4px 10px 14px; border-bottom:1px solid var(--border);}

<script>
/* ================================================================
   NAILS STUDIO — App de gestión integral para negocio de uñas
   100% offline, almacenamiento local con IndexedDB.
   Organizado en módulos dentro de un único archivo.
   ================================================================ */
'use strict';

/* ================================================================
   MÓDULO: BASE DE DATOS (IndexedDB)
   ================================================================
   Stores:
   - config          : configuración general (clave única "app")
   - categories      : categorías/subcategorías de servicios (árbol)
   - services        : servicios del catálogo
   - productCategories: categorías/subcategorías de productos
   - products        : productos para venta
   - clients         : clientes
   - appointments    : citas de la agenda
   - sales           : historial de ventas (nunca se borran)
   - purchases       : compras de mercancía
   - expenses        : gastos del negocio (no recuperables)
   - notes           : bloc de notas
   - noteCategories  : categorías de notas
   - photos          : galería de fotografías (comprimidas)
   - albums          : álbumes de la galería
   - trash           : papelera de recuperación (30 días)
   ================================================================ */
const DB_NAME='nails_studio_db';
const DB_VERSION=1;
let db=null;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);

    req.onupgradeneeded=(e)=>{
      const d=e.target.result;

      if(!d.objectStoreNames.contains('config')){
        d.createObjectStore('config',{keyPath:'id'});
      }
      if(!d.objectStoreNames.contains('categories')){
        const s=d.createObjectStore('categories',{keyPath:'id'});
        s.createIndex('parentId','parentId',{unique:false});
        s.createIndex('order','order',{unique:false});
      }
      if(!d.objectStoreNames.contains('services')){
        const s=d.createObjectStore('services',{keyPath:'id'});
        s.createIndex('categoryId','categoryId',{unique:false});
        s.createIndex('subcategoryId','subcategoryId',{unique:false});
        s.createIndex('status','status',{unique:false});
        s.createIndex('name','name',{unique:false});
      }
      if(!d.objectStoreNames.contains('productCategories')){
        const s=d.createObjectStore('productCategories',{keyPath:'id'});
        s.createIndex('parentId','parentId',{unique:false});
      }
      if(!d.objectStoreNames.contains('products')){
        const s=d.createObjectStore('products',{keyPath:'id'});
        s.createIndex('categoryId','categoryId',{unique:false});
        s.createIndex('subcategoryId','subcategoryId',{unique:false});
        s.createIndex('code','code',{unique:false});
        s.createIndex('status','status',{unique:false});
        s.createIndex('name','name',{unique:false});
      }
      if(!d.objectStoreNames.contains('clients')){
        const s=d.createObjectStore('clients',{keyPath:'id'});
        s.createIndex('name','name',{unique:false});
        s.createIndex('phone','phone',{unique:false});
        s.createIndex('lastVisit','lastVisit',{unique:false});
      }
      if(!d.objectStoreNames.contains('appointments')){
        const s=d.createObjectStore('appointments',{keyPath:'id'});
        s.createIndex('clientId','clientId',{unique:false});
        s.createIndex('date','date',{unique:false});
        s.createIndex('status','status',{unique:false});
      }
      if(!d.objectStoreNames.contains('sales')){
        const s=d.createObjectStore('sales',{keyPath:'id'});
        s.createIndex('clientId','clientId',{unique:false});
        s.createIndex('date','date',{unique:false});
        s.createIndex('paymentMethod','paymentMethod',{unique:false});
      }
      if(!d.objectStoreNames.contains('purchases')){
        const s=d.createObjectStore('purchases',{keyPath:'id'});
        s.createIndex('date','date',{unique:false});
        s.createIndex('productId','productId',{unique:false});
      }
      if(!d.objectStoreNames.contains('expenses')){
        const s=d.createObjectStore('expenses',{keyPath:'id'});
        s.createIndex('date','date',{unique:false});
        s.createIndex('category','category',{unique:false});
      }
      if(!d.objectStoreNames.contains('notes')){
        const s=d.createObjectStore('notes',{keyPath:'id'});
        s.createIndex('categoryId','categoryId',{unique:false});
        s.createIndex('favorite','favorite',{unique:false});
        s.createIndex('updatedAt','updatedAt',{unique:false});
      }
      if(!d.objectStoreNames.contains('noteCategories')){
        d.createObjectStore('noteCategories',{keyPath:'id'});
      }
      if(!d.objectStoreNames.contains('photos')){
        const s=d.createObjectStore('photos',{keyPath:'id'});
        s.createIndex('albumId','albumId',{unique:false});
        s.createIndex('clientId','clientId',{unique:false});
        s.createIndex('serviceId','serviceId',{unique:false});
        s.createIndex('favorite','favorite',{unique:false});
        s.createIndex('createdAt','createdAt',{unique:false});
      }
      if(!d.objectStoreNames.contains('albums')){
        d.createObjectStore('albums',{keyPath:'id'});
      }
      if(!d.objectStoreNames.contains('trash')){
        const s=d.createObjectStore('trash',{keyPath:'id'});
        s.createIndex('deletedAt','deletedAt',{unique:false});
        s.createIndex('storeName','storeName',{unique:false});
      }
    };

    req.onsuccess=(e)=>{ db=e.target.result; resolve(db); };
    req.onerror=(e)=>{ reject(e.target.error); };
  });
}

/* --- Helpers genéricos CRUD sobre cualquier store --- */
function tx(storeName,mode='readonly'){
  return db.transaction(storeName,mode).objectStore(storeName);
}
function dbGet(storeName,id){
  return new Promise((res,rej)=>{
    const r=tx(storeName).get(id);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function dbGetAll(storeName){
  return new Promise((res,rej)=>{
    const r=tx(storeName).getAll();
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function dbPut(storeName,value){
  return new Promise((res,rej)=>{
    const r=tx(storeName,'readwrite').put(value);
    r.onsuccess=()=>res(value); r.onerror=()=>rej(r.error);
  });
}
function dbDelete(storeName,id){
  return new Promise((res,rej)=>{
    const r=tx(storeName,'readwrite').delete(id);
    r.onsuccess=()=>res(true); r.onerror=()=>rej(r.error);
  });
}
function dbGetByIndex(storeName,indexName,value){
  return new Promise((res,rej)=>{
    const r=tx(storeName).index(indexName).getAll(value);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function dbCount(storeName){
  return new Promise((res,rej)=>{
    const r=tx(storeName).count();
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function uid(){
  return Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);
}
function nowISO(){ return new Date().toISOString(); }

/* --- Mover un registro a la Papelera en lugar de borrarlo directo ---
   (mejora #8 sobre el original: recuperación de 30 días) */
async function moveToTrash(storeName,record){
  const trashItem={
    id:uid(),
    storeName,
    originalId:record.id,
    data:record,
    deletedAt:nowISO()
  };
  await dbPut('trash',trashItem);
  await dbDelete(storeName,record.id);
  return trashItem;
}
async function restoreFromTrash(trashId){
  const item=await dbGet('trash',trashId);
  if(!item) return false;
  await dbPut(item.storeName,item.data);
  await dbDelete('trash',trashId);
  return true;
}
async function purgeOldTrash(){
  const items=await dbGetAll('trash');
  const cutoff=Date.now()-30*24*60*60*1000;
  for(const it of items){
    if(new Date(it.deletedAt).getTime()<cutoff){
      await dbDelete('trash',it.id);
    }
  }
}

/* ================================================================
   MÓDULO: CONFIGURACIÓN Y MONEDA
   ================================================================
   Config vive en el store 'config' bajo la clave fija 'app'.
   Tipo de cambio 100% manual (nunca se consulta a Internet).
   ================================================================ */
const DEFAULT_CONFIG={
  id:'app',
  businessName:'Nails Studio',
  logo:null,
  address:'',
  phone:'',
  social:{instagram:'',facebook:'',whatsapp:''},
  currencyMain:'CUP',

  accentColor:'#D4AF7A',

  installPromptDismissed:false,
  createdAt:null
};

let CONFIG=null;

async function loadConfig(){
  let cfg=await dbGet('config','app');
  if(!cfg){
    cfg={...DEFAULT_CONFIG, createdAt:nowISO()};
    await dbPut('config',cfg);
  }
  CONFIG=cfg;
  applyConfigToUI();
  return cfg;
}

async function saveConfig(patch){
  CONFIG={...CONFIG,...patch};
  await dbPut('config',CONFIG);
  applyConfigToUI();
  return CONFIG;
}

/* Validación de tipo de cambio — mejora #10: nunca acepta valores inválidos */
async function setExchangeRate(newRate){
  const rate=parseFloat(newRate);
  if(!rate || rate<=0 || isNaN(rate)){
    return {ok:false, error:'El tipo de cambio debe ser un número mayor a 0.'};
  }
  const history=[...(CONFIG.exchangeRateHistory||[]), {rate:CONFIG.exchangeRate, date:nowISO()}].slice(-50);
  await saveConfig({exchangeRate:rate, exchangeRateHistory:history});
  return {ok:true};
}

function applyConfigToUI(){
  if(!CONFIG) return;
  document.documentElement.setAttribute('data-theme',CONFIG.theme);
  document.documentElement.style.setProperty('--text-scale',CONFIG.textScale);
  document.documentElement.style.setProperty('--primary',CONFIG.primaryColor);
  document.documentElement.style.setProperty('--accent',CONFIG.accentColor);
  // Derivar variantes del color primario para mantener contraste consistente
  const dark=shadeColor(CONFIG.primaryColor,-18);
  const light=shadeColor(CONFIG.primaryColor,55);
  const tint=shadeColor(CONFIG.primaryColor,88);
  document.documentElement.style.setProperty('--primary-dark',dark);
  document.documentElement.style.setProperty('--primary-light',light);
  document.documentElement.style.setProperty('--primary-tint',tint);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content',CONFIG.primaryColor);
}

/* Aclara/oscurece un color hex por un porcentaje (-100 a 100) */
function shadeColor(hex,percent){
  hex=hex.replace('#','');
  let r=parseInt(hex.substring(0,2),16);
  let g=parseInt(hex.substring(2,4),16);
  let b=parseInt(hex.substring(4,6),16);
  r=Math.round(r+(percent<0?r:255-r)*(percent/100));
  g=Math.round(g+(percent<0?g:255-g)*(percent/100));
  b=Math.round(b+(percent<0?b:255-b)*(percent/100));
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

/* --- Conversión de moneda: CUP es la moneda base de almacenamiento --- */
function cupToUsd(cup){
  if(!CONFIG || !CONFIG.exchangeRate) return 0;
  return cup/CONFIG.exchangeRate;
}
function usdToCup(usd){
  if(!CONFIG || !CONFIG.exchangeRate) return 0;
  return usd*CONFIG.exchangeRate;
}
function fmtCUP(value){
  const n=Number(value)||0;
  return n.toLocaleString('es-CU',{minimumFractionDigits:0,maximumFractionDigits:0})+' CUP';
}
function fmtUSD(value){
  const n=Number(value)||0;
  return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' USD';
}
/* Par de montos CUP + USD, tal como pide el punto 5 del original en todo lugar con dinero */
function fmtDual(cupValue){
  return `${fmtCUP(cupValue)} <span class="dual-usd">≈ ${fmtUSD(cupToUsd(cupValue))}</span>`;
}

/* ================================================================
   MÓDULO: COMPRESIÓN DE IMÁGENES
   ================================================================
   CORRECCIÓN TÉCNICA (mejora #7): las fotos de cámara pesan 3-8MB.
   Guardarlas crudas en IndexedDB degradaría el rendimiento con miles
   de fotos. Se redimensionan a máx 1280px y se comprimen a JPEG ~0.75
   antes de guardar, dejando cada foto en ~100-300KB.
   ================================================================ */
function compressImage(file,maxSize=1280,quality=0.75){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        let {width,height}=img;
        if(width>height && width>maxSize){
          height=Math.round(height*(maxSize/width)); width=maxSize;
        }else if(height>maxSize){
          width=Math.round(width*(maxSize/height)); height=maxSize;
        }
        const canvas=document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
/* Miniatura extra pequeña para listados (grillas de galería, tarjetas) */
function compressThumbnail(file){
  return compressImage(file,240,0.65);
}

/* ================================================================
   MÓDULO: ROUTER (hash-based, sin servidor)
   ================================================================ */
const ROUTES={
  dashboard:{label:'Inicio',icon:'home'},
  agenda:{label:'Agenda',icon:'calendar'},
  venta:{label:'Vender',icon:'plus-circle'},
  clientes:{label:'Clientes',icon:'users'},
  mas:{label:'Más',icon:'menu'}
};
// Sub-rutas accesibles desde "Más": servicios, productos, compras, gastos,
// ventas (historial), estadísticas, notas, galería, configuración, papelera
let currentRoute='dashboard';
let currentParams={};

function navigate(route,params={}){
  currentRoute=route;
  currentParams=params;
  window.location.hash='#'+route+(params.id?('/'+params.id):'');
  renderRoute();
  window.scrollTo(0,0);
}

window.addEventListener('hashchange',()=>{
  const hash=window.location.hash.replace('#','');
  const [route,id]=hash.split('/');
  currentRoute=route||'dashboard';
  currentParams=id?{id}:{};
  renderRoute();
});

function renderRoute(){
  const container=document.getElementById('view-container');
  if(!container) return;
  container.innerHTML='<div class="view-loading"><div class="spinner"></div></div>';
  const renderers={
    dashboard:renderDashboard,
    agenda:renderAgenda,
    venta:renderVentaRapida,
    clientes:renderClientes,
    'cliente-detalle':renderClienteDetalle,
    mas:renderMas,
    servicios:renderServicios,
    productos:renderProductos,
    compras:renderCompras,
    gastos:renderGastos,
    ventas:renderHistorialVentas,
    estadisticas:renderEstadisticas,
    notas:renderNotas,
    galeria:renderGaleria,
    configuracion:renderConfiguracion,
    papelera:renderPapelera
  };
  const fn=renderers[currentRoute]||renderDashboard;
  requestAnimationFrame(()=>fn(container,currentParams));
  updateBottomNavActive();
}

function updateBottomNavActive(){
  document.querySelectorAll('.bn-item').forEach(el=>{
    const active = el.dataset.route===currentRoute ||
      (el.dataset.route==='mas' && !['dashboard','agenda','venta','clientes'].includes(currentRoute));
    el.classList.toggle('active',active);
  });
}

/* ================================================================
   MÓDULO: TOASTS (confirmaciones no intrusivas)
   ================================================================ */
function toast(message,type='default',duration=2600){
  const wrap=document.getElementById('toast-container');
  const el=document.createElement('div');
  el.className=`toast toast-${type}`;
  const icons={success:'check',error:'alert-triangle',default:''};
  el.innerHTML=`${icons[type]?icon(icons[type],16):''}<span>${message}</span>`;
  wrap.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=>el.remove(),250);
  },duration);
}

/* ================================================================
   MÓDULO: MODALES / BOTTOM SHEETS
   ================================================================ */
function openModal(html,{onClose=null,fullscreen=false}={}){
  const root=document.getElementById('modal-root');
  root.innerHTML=`
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-sheet ${fullscreen?'fullscreen':''}" id="modal-sheet">
        ${html}
      </div>
    </div>`;
  requestAnimationFrame(()=>{
    document.getElementById('modal-overlay').classList.add('show');
  });
  document.getElementById('modal-overlay').addEventListener('click',(e)=>{
    if(e.target.id==='modal-overlay') closeModal(onClose);
  });
  return root;
}
function closeModal(onClose){
  const overlay=document.getElementById('modal-overlay');
  if(!overlay) return;
  overlay.classList.remove('show');
  setTimeout(()=>{
    document.getElementById('modal-root').innerHTML='';
    if(onClose) onClose();
  },220);
}
function confirmDialog(message,{title='¿Confirmar?',danger=false}={}){
  return new Promise((resolve)=>{
    openModal(`
      <div class="confirm-dialog">
        <div class="confirm-icon ${danger?'danger':''}">${icon(danger?'trash':'check',22)}</div>
        <h3>${title}</h3>
        <p>${message}</p>
        <div class="confirm-actions">
          <button class="btn btn-ghost" id="confirm-cancel">Cancelar</button>
          <button class="btn ${danger?'btn-danger':'btn-primary'}" id="confirm-ok">Confirmar</button>
        </div>
      </div>
    `);
    document.getElementById('confirm-cancel').onclick=()=>{closeModal();resolve(false);};
    document.getElementById('confirm-ok').onclick=()=>{closeModal();resolve(true);};
  });
}

/* ================================================================
   HELPERS DE FECHAS
   ================================================================ */
function startOfDay(d=new Date()){const x=new Date(d); x.setHours(0,0,0,0); return x;}
function endOfDay(d=new Date()){const x=new Date(d); x.setHours(23,59,59,999); return x;}
function startOfWeek(d=new Date()){const x=startOfDay(d); const day=x.getDay(); x.setDate(x.getDate()-day); return x;}
function startOfMonth(d=new Date()){const x=new Date(d.getFullYear(),d.getMonth(),1); return x;}
function startOfYear(d=new Date()){const x=new Date(d.getFullYear(),0,1); return x;}
function fmtDate(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('es-CU',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtDateShort(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('es-CU',{day:'2-digit',month:'short'});
}
function fmtTime(iso){
  const d=new Date(iso);
  return d.toLocaleTimeString('es-CU',{hour:'2-digit',minute:'2-digit'});
}
function isSameDay(a,b){
  return new Date(a).toDateString()===new Date(b).toDateString();
}

  const monthSales=sales.filter(s=>new Date(s.date)>=startOfMonth(now));
  const monthExpenses=(await dbGetAll('expenses')).filter(e=>new Date(e.date)>=startOfMonth(now));
  const monthPurchases=(await dbGetAll('purchases')).filter(p=>new Date(p.date)>=startOfMonth(now));

  const sum=(arr,field)=>arr.reduce((a,x)=>a+(Number(x[field])||0),0);
  const todayRevenue=sum(todaySales,'total');
  const todayProfit=sum(todaySales,'profit');
  const monthRevenue=sum(monthSales,'total');

  const upcomingAppts=appointments

      <div class="stat-card">

let agendaView='semanal'; // diaria | semanal | mensual
let agendaDate=new Date();

async function renderAgenda(container){
  setHeader('Agenda',{actions:`<button class="btn-icon primary" onclick="openNewAppointmentModal()">${icon('plus',20)}</button>`});
  const appointments=await dbGetAll('appointments');

  container.innerHTML=`
    <div class="segmented" style="margin-bottom:14px">
      <button class="${agendaView==='diaria'?'active':''}" onclick="setAgendaView('diaria')">Día</button>
      <button class="${agendaView==='semanal'?'active':''}" onclick="setAgendaView('semanal')">Semana</button>
      <button class="${agendaView==='mensual'?'active':''}" onclick="setAgendaView('mensual')">Mes</button>
    </div>
    <div class="agenda-nav">
      <button class="btn-icon" onclick="shiftAgendaDate(-1)">${icon('chevron-left',18)}</button>
      <div class="agenda-nav-label">${agendaLabel()}</div>
      <button class="btn-icon" onclick="shiftAgendaDate(1)">${icon('chevron-right',18)}</button>
    </div>
    <div id="agenda-body"></div>
  `;
  renderAgendaBody(appointments);
}

function agendaLabel(){
  if(agendaView==='diaria') return agendaDate.toLocaleDateString('es-CU',{weekday:'long',day:'numeric',month:'long'});
  if(agendaView==='mensual') return agendaDate.toLocaleDateString('es-CU',{month:'long',year:'numeric'});
  const start=startOfWeek(agendaDate), end=new Date(start); end.setDate(end.getDate()+6);
  return `${start.toLocaleDateString('es-CU',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('es-CU',{day:'numeric',month:'short'})}`;
}

function setAgendaView(v){ agendaView=v; renderRoute(); }
function shiftAgendaDate(dir){
  const d=new Date(agendaDate);
  if(agendaView==='diaria') d.setDate(d.getDate()+dir);
  else if(agendaView==='semanal') d.setDate(d.getDate()+dir*7);
  else d.setMonth(d.getMonth()+dir);
  agendaDate=d;
  renderRoute();
}

function renderAgendaBody(appointments){
  const body=document.getElementById('agenda-body');
  if(!body) return;
  const statusColor={pendiente:'warning',confirmada:'info',finalizada:'success',cancelada:'danger'};

  if(agendaView==='mensual'){
    const days=monthGridDays(agendaDate);
    body.innerHTML=`
      <div class="month-grid">
        ${['D','L','M','M','J','V','S'].map(d=>`<div class="month-dow">${d}</div>`).join('')}
        ${days.map(d=>{
          const dayAppts=appointments.filter(a=>isSameDay(a.date,d.date));
          return `<div class="month-cell ${d.otherMonth?'other-month':''} ${isSameDay(d.date,new Date())?'today':''}"
                       onclick="agendaDate=new Date('${d.date.toISOString()}'); agendaView='diaria'; renderRoute();">
            <div class="month-daynum">${d.date.getDate()}</div>
            ${dayAppts.length?`<div class="month-dot"></div>`:''}
          </div>`;
        }).join('')}
      </div>
    `;
    return;
  }

  const daysToShow=agendaView==='diaria'?[agendaDate]:weekDays(agendaDate);
  const relevant=appointments.filter(a=>daysToShow.some(d=>isSameDay(a.date,d)))
    .sort((a,b)=>new Date(a.date)-new Date(b.date));

  if(relevant.length===0){
    body.innerHTML=`
      <div class="empty-state">
        <div class="empty-icon">${icon('calendar',28)}</div>
        <h4>Sin citas en este período</h4>
        <p>Toca el botón + para agendar una nueva cita.</p>
      </div>`;
    return;
  }

  body.innerHTML=daysToShow.map(day=>{
    const dayAppts=relevant.filter(a=>isSameDay(a.date,day));
    if(agendaView==='semanal' && dayAppts.length===0) return '';
    return `
      ${agendaView==='semanal'?`<div class="agenda-day-label">${day.toLocaleDateString('es-CU',{weekday:'long',day:'numeric'})}</div>`:''}
      ${dayAppts.map(a=>`
        <div class="card appt-card" onclick="openAppointmentDetail('${a.id}')">
          <div class="appt-time">
            <div style="font-weight:700">${fmtTime(a.date)}</div>
          </div>
          <div class="appt-body">
            <div style="font-weight:700">${a.clientName}</div>
            <div style="font-size:var(--text-sm); color:var(--text-soft)">${a.serviceName||''}</div>
          </div>
          <span class="badge badge-${statusColor[a.status]||'neutral'}">${a.status}</span>
        </div>
      `).join('')}
    `;
  }).join('');
}

function weekDays(d){
  const start=startOfWeek(d);
  return Array.from({length:7},(_,i)=>{const x=new Date(start); x.setDate(x.getDate()+i); return x;});
}
function monthGridDays(d){
  const first=startOfMonth(d);
  const gridStart=new Date(first); gridStart.setDate(gridStart.getDate()-first.getDay());
  return Array.from({length:42},(_,i)=>{
    const date=new Date(gridStart); date.setDate(date.getDate()+i);
    return {date, otherMonth:date.getMonth()!==d.getMonth()};
  });
}

let cartTip=0; // propina dejada por la clienta — no afecta la ganancia del servicio, se registra aparte
let cartNotes='';

function resetCart(){
  cartItems=[]; cartClient=null; cartDiscount={type:'amount',value:0,reason:''};
  cartPaymentMethod='efectivo'; cartTip=0; cartNotes='';
}

let vrActiveTab='services';

async function renderVentaRapida(container){
  setHeader('Venta rápida',{actions:`
    <button class="btn-icon" id="vr-quick-cat-btn" title="Nueva categoría">${icon('tag',18)}</button>
    <button class="btn-icon primary" id="vr-quick-add-btn" title="Agregar servicio o producto nuevo">${icon('plus',20)}</button>
  `});
  const services=(await dbGetAll('services')).filter(s=>s.status!=='inactive');
  const products=(await dbGetAll('products')).filter(p=>p.status!=='inactive');

  container.innerHTML=`
    <div class="segmented" style="margin-bottom:14px">
      <button id="vr-tab-services" onclick="vrSwitchTab('services')">Servicios</button>
      <button id="vr-tab-products" onclick="vrSwitchTab('products')">Productos</button>
    </div>
    <div class="search-bar">
      ${icon('search',18)}
      <input type="text" id="vr-search" placeholder="Buscar…">
    </div>
    <div id="vr-catalog"></div>

    <div id="cart-bar" class="cart-bar ${cartItems.length?'':'hidden'}" onclick="openCartModal()">
      <div>
        <div style="font-size:var(--text-xs); opacity:0.85">${cartItems.length} artículo(s)</div>
        <div style="font-weight:700">${fmtCUP(cartSubtotal())}</div>
      </div>
      <div class="btn btn-sm" style="background:rgba(255,255,255,0.2); color:#fff">Ver venta ${icon('chevron-right',16)}</div>
    </div>
  `;
  window.vrData={services,products};
  vrSwitchTab(vrActiveTab);

  document.getElementById('vr-search').oninput=(e)=>{
    const term=e.target.value.toLowerCase();
    const source=vrActiveTab==='services'?services:products;
    const filtered=term?source.filter(x=>x.name.toLowerCase().includes(term)):source;
    renderVrCatalog(vrActiveTab,filtered);
  };
  document.getElementById('vr-quick-add-btn').onclick=()=>openVrQuickCreate();
  document.getElementById('vr-quick-cat-btn').onclick=()=>openVrQuickCategory();
}
function openVrQuickCreate(){
  const tab=vrActiveTab;
  if(tab==='services'){
    openServiceModal(null,null,null,(newService)=>{
      addToCart('services',newService.id,newService);
      renderRoute(); // refresca el catálogo de venta rápida con el nuevo servicio incluido
    });
  }else{
    openProductModal(null,null,null,(newProduct)=>{
      addToCart('products',newProduct.id,newProduct);
      renderRoute();
    });
  }
}
function openVrQuickCategory(){
  const storeName=vrActiveTab==='services'?'categories':'productCategories';
  openCategoryModal(storeName,null,null,()=>renderRoute());
}
function vrSwitchTab(tab){
  vrActiveTab=tab;
  document.getElementById('vr-tab-services').classList.toggle('active',tab==='services');
  document.getElementById('vr-tab-products').classList.toggle('active',tab==='products');
  renderVrCatalog(tab, tab==='services'?window.vrData.services:window.vrData.products);
}
function renderVrCatalog(type,items){
  const el=document.getElementById('vr-catalog');
  const label=type==='services'?'servicio':'producto';
  if(items.length===0){
    el.innerHTML=`
      <div class="empty-state">
        <p>Sin resultados</p>
        <button class="btn btn-secondary btn-sm" style="margin-top:10px" onclick="openVrQuickCreate()">${icon('plus',14)} Crear ${label} nuevo</button>
      </div>`;
    return;
  }
  el.innerHTML=`
    <div class="card">${items.map(it=>`
      <div class="list-row">
        <div style="display:flex; align-items:center; gap:var(--sp-3); flex:1; min-width:0; cursor:pointer" onclick="addToCart('${type}','${it.id}')">
          <div class="list-row-avatar" style="background:${(it.color||'#C9184A')}22; color:${it.color||'var(--primary)'}">
            ${icon(type==='services'?'droplet':'box',18)}
          </div>
          <div class="list-row-body">
            <div class="list-row-title">${it.name}</div>
            <div class="list-row-sub">${type==='products'?`Stock: ${it.quantity||0}`:`${it.estimatedTime||'—'} min`}</div>
          </div>
        </div>
        <div style="font-weight:700; margin-right:6px">${fmtCUP(type==='services'?it.suggestedPrice:it.salePrice)}</div>
        <button class="btn-icon" style="width:32px; height:32px" onclick="openVrEditItem('${type}','${it.id}')" title="Editar">${icon('edit',15)}</button>
      </div>
    `).join('')}</div>
    <button class="btn btn-ghost btn-sm btn-block" style="margin-top:10px" onclick="openVrQuickCreate()">${icon('plus',14)} Crear ${label} nuevo</button>
  `;
}
function openVrEditItem(type,id){
  const source=type==='services'?window.vrData.services:window.vrData.products;
  const item=source.find(x=>x.id===id);
  if(!item) return;
  if(type==='services'){
    openServiceModal(item,null,null,()=>renderRoute());
  }else{
    openProductModal(item,null,null,()=>renderRoute());
  }
}

function addToCart(type,id,directItem=null){
  const source=type==='services'?window.vrData.services:window.vrData.products;
  const item=directItem||source.find(x=>x.id===id);
  if(!item) return;
  const isService=type==='services';
  const existing=cartItems.find(c=>c.refId===id);
  if(existing && !isService){
    existing.qty+=1;
  }else{
    cartItems.push({
      lineId:uid(), refId:id, type:isService?'service':'product',
      name:item.name,
      price:isService?item.suggestedPrice:item.salePrice,
      cost:isService?(item.materialCost||0):(item.purchasePrice||0),
      qty:1
    });
  }
  toast(`${item.name} agregado`,'success',1400);
  updateCartBar();
}
function updateCartBar(){
  const bar=document.getElementById('cart-bar');
  if(!bar) return;
  bar.classList.toggle('hidden',cartItems.length===0);
  bar.querySelector('div div')&&(bar.innerHTML=`
    <div>
      <div style="font-size:var(--text-xs); opacity:0.85">${cartItems.length} artículo(s)</div>
      <div style="font-weight:700">${fmtCUP(cartSubtotal())}</div>
    </div>
    <div class="btn btn-sm" style="background:rgba(255,255,255,0.2); color:#fff">Ver venta ${icon('chevron-right',16)}</div>
  `);
}
function cartSubtotal(){ return cartItems.reduce((a,i)=>a+i.price*i.qty,0); }
function cartCost(){ return cartItems.reduce((a,i)=>a+i.cost*i.qty,0); }
function cartDiscountAmount(){
  if(cartDiscount.type==='percent') return cartSubtotal()*(cartDiscount.value/100);
  return Math.min(cartDiscount.value,cartSubtotal());
}
function cartTotal(){ return Math.max(0,cartSubtotal()-cartDiscountAmount()); }
function cartProfit(){ return cartTotal()-cartCost(); }

async function openCartModal(){
  const clients=await dbGetAll('clients');
  openModal(`
    <h3 style="font-family:var(--font-display); font-size:var(--text-lg); margin-bottom:var(--sp-4)">Resumen de venta</h3>
    <div class="cart-items">
      ${cartItems.map(i=>`
        <div class="cart-line">
          <div class="cart-line-info">
            <div style="font-weight:600">${i.name}</div>
            <div style="font-size:var(--text-xs); color:var(--text-faint)">${fmtCUP(i.price)} c/u</div>
          </div>
          <div class="cart-line-qty">
            <button onclick="changeCartQty('${i.lineId}',-1)">−</button>
            <span>${i.qty}</span>
            <button onclick="changeCartQty('${i.lineId}',1)">+</button>
          </div>
          <button class="btn-icon" onclick="removeCartLine('${i.lineId}')" style="width:32px; height:32px">${icon('x',15)}</button>
        </div>
      `).join('')}
    </div>
    <button class="btn btn-outline btn-block btn-sm" style="margin-top:8px" onclick="closeModal()">+ Agregar otro artículo</button>

    <div class="field" style="margin-top:var(--sp-5)">
      <label>Cliente</label>
      <select id="cart-client">
        <option value="">Sin especificar</option>
        ${clients.map(c=>`<option value="${c.id}" ${cartClient===c.id?'selected':''}>${c.name}</option>`).join('')}
      </select>
    </div>

    <div class="field">
      <label>Descuento</label>
      <div style="display:flex; gap:8px">
        <div class="segmented" style="flex:0 0 130px">
          <button class="${cartDiscount.type==='amount'?'active':''}" id="disc-amount">CUP</button>
          <button class="${cartDiscount.type==='percent'?'active':''}" id="disc-percent">%</button>
        </div>
        <input type="number" id="cart-discount-value" value="${cartDiscount.value||''}" placeholder="0" style="flex:1; padding:12px; border-radius:var(--r-md); border:1.5px solid var(--border)">
      </div>
    </div>

    <div class="field">
      <label>Forma de pago</label>
      <div class="chip-group" id="cart-payment">
        ${['efectivo','transferencia','mixto'].map(m=>`<button type="button" class="chip ${cartPaymentMethod===m?'active':''}" data-v="${m}">${m}</button>`).join('')}
      </div>
    </div>

    <div class="field">
      <label>Propina</label>
      <input type="number" id="cart-tip" value="${cartTip||''}" placeholder="0 (opcional)">
      <div class="field-hint">Lo que la clienta deja de propina. Se registra por separado, no afecta la ganancia del servicio.</div>
    </div>

    <div class="field">
      <label>Observaciones</label>
      <textarea id="cart-notes" placeholder="Opcional">${cartNotes}</textarea>
    </div>

    <div class="cart-totals">
      <div class="ct-row"><span>Subtotal</span><span>${fmtCUP(cartSubtotal())}</span></div>
      <div class="ct-row"><span>Descuento</span><span id="ct-discount">-${fmtCUP(cartDiscountAmount())}</span></div>
      <div class="ct-row"><span>Costo estimado</span><span>${fmtCUP(cartCost())}</span></div>
      <div class="ct-row" style="color:var(--success)"><span>Ganancia bruta</span><span id="ct-profit">${fmtCUP(cartProfit())}</span></div>
      <div class="ct-row ct-final"><span>Total del servicio/productos</span><span id="ct-total">${fmtCUP(cartTotal())}</span></div>
      <div class="ct-row" style="color:var(--text-faint); font-size:var(--text-sm)"><span></span><span id="ct-total-usd">≈ ${fmtUSD(cupToUsd(cartTotal()))}</span></div>
      <div class="ct-row" style="color:var(--accent-dark)"><span>Propina</span><span id="ct-tip">${fmtCUP(cartTip)}</span></div>
      <div class="ct-row ct-final" style="border-top:2px solid var(--border)"><span>Total a cobrar</span><span id="ct-grand-total">${fmtCUP(cartTotal()+cartTip)}</span></div>
    </div>

    <button class="btn btn-primary btn-block" id="cart-confirm" style="margin-top:var(--sp-4)">${icon('check',18)} Confirmar venta</button>
  `,{fullscreen:true});

  const recalc=()=>{
    cartDiscount.value=parseFloat(document.getElementById('cart-discount-value').value)||0;
    cartTip=parseFloat(document.getElementById('cart-tip').value)||0;
    document.getElementById('ct-discount').textContent='-'+fmtCUP(cartDiscountAmount());
    document.getElementById('ct-profit').textContent=fmtCUP(cartProfit());
    document.getElementById('ct-total').textContent=fmtCUP(cartTotal());
    document.getElementById('ct-total-usd').textContent='≈ '+fmtUSD(cupToUsd(cartTotal()));
    document.getElementById('ct-tip').textContent=fmtCUP(cartTip);
    document.getElementById('ct-grand-total').textContent=fmtCUP(cartTotal()+cartTip);
  };
  document.getElementById('cart-tip').oninput=recalc;
  document.getElementById('disc-amount').onclick=()=>{cartDiscount.type='amount'; document.getElementById('disc-amount').classList.add('active'); document.getElementById('disc-percent').classList.remove('active'); recalc();};
  document.getElementById('disc-percent').onclick=()=>{cartDiscount.type='percent'; document.getElementById('disc-percent').classList.add('active'); document.getElementById('disc-amount').classList.remove('active'); recalc();};
  document.getElementById('cart-discount-value').oninput=recalc;
  document.querySelectorAll('#cart-payment .chip').forEach(chip=>{
    chip.onclick=()=>{
      document.querySelectorAll('#cart-payment .chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      cartPaymentMethod=chip.dataset.v;
    };
  });

  document.getElementById('cart-confirm').onclick=async()=>{
    if(cartItems.length===0){ toast('Agrega al menos un artículo','error'); return; }
    const clientId=document.getElementById('cart-client').value||null;
    const client=clientId?await dbGet('clients',clientId):null;
    const sale={
      id:uid(),
      date:nowISO(),
      clientId, clientName:client?.name||null,
      items:cartItems.map(i=>({name:i.name,type:i.type,price:i.price,qty:i.qty,cost:i.cost})),
      subtotal:cartSubtotal(),
      discount:cartDiscountAmount(),
      discountType:cartDiscount.type,
      cost:cartCost(),
      total:cartTotal(),
      profit:cartProfit(),
      tip:cartTip,
      grandTotal:cartTotal()+cartTip,
      paymentMethod:cartPaymentMethod,
      notes:document.getElementById('cart-notes').value.trim()
    };
    await dbPut('sales',sale);

    // Descontar stock de productos vendidos
    for(const item of cartItems.filter(i=>i.type==='product')){
      const prod=await dbGet('products',item.refId);
      if(prod){
        prod.quantity=Math.max(0,(prod.quantity||0)-item.qty);
        await dbPut('products',prod);
      }
    }
    resetCart();
    closeModal();
    toast('Venta registrada','success');
    navigate('dashboard');
  };
}
function changeCartQty(lineId,delta){
  const item=cartItems.find(i=>i.lineId===lineId);
  if(!item) return;
  item.qty=Math.max(1,item.qty+delta);
  openCartModal();
}
function removeCartLine(lineId){
  cartItems=cartItems.filter(i=>i.lineId!==lineId);
  if(cartItems.length===0){ closeModal(); toast('Venta vacía','default',1500); }
  else openCartModal();
}

/* ================================================================
   VISTA: PRODUCTOS PARA LA VENTA (punto 12 del original)
   ================================================================ */
async function renderProductos(container){
  setHeader('Productos',{back:true,actions:`
    <button class="btn-icon" onclick="openCategoryModal('productCategories')" title="Nueva categoría">${icon('tag',18)}</button>
    <button class="btn-icon primary" onclick="openProductModal(null,null,null)" title="Nuevo producto">${icon('plus',20)}</button>
  `});
  const categories=await dbGetAll('productCategories');
  const products=await dbGetAll('products');
  const topCats=categories.filter(c=>!c.parentId);
  const uncategorized=products.filter(p=>!p.categoryId);

  container.innerHTML=`
    <button class="btn btn-secondary btn-block" style="margin-bottom:14px" onclick="openProductModal(null,null,null)">${icon('plus',16)} Nuevo producto</button>
    ${topCats.length===0 && uncategorized.length===0?`
      <div class="empty-state">
        <div class="empty-icon">${icon('shopping-bag',28)}</div>
        <h4>Sin productos aún</h4>
        <p>Agrega tu primer producto arriba, o crea una categoría (ej. Esmaltes, Limas, Accesorios) para organizarlos.</p>
        <button class="btn btn-ghost" style="margin-top:16px" onclick="openCategoryModal('productCategories')">Crear categoría</button>
      </div>
    `:`
      ${topCats.map(cat=>{
        const subcats=categories.filter(c=>c.parentId===cat.id);
        const directProducts=products.filter(p=>p.categoryId===cat.id && !p.subcategoryId);
        return `
          <div class="section-title">${cat.name} <span class="link" onclick="openCategoryModal('productCategories','${cat.id}')">Editar</span></div>
          <div class="card" style="margin-bottom:10px">
            ${subcats.map(sub=>{
              const subProducts=products.filter(p=>p.subcategoryId===sub.id);
              return `
                <div class="cat-row" onclick="toggleSubcat('p-${sub.id}')"><span>${sub.name}</span><span class="badge badge-neutral">${subProducts.length}</span></div>
                <div class="subcat-services" id="subcat-p-${sub.id}" style="display:none">
                  ${subProducts.map(p=>productRowHTML(p)).join('')}
                  <button class="btn btn-secondary btn-sm btn-block" style="margin-top:8px" onclick="openProductModal(null,'${cat.id}','${sub.id}')">${icon('plus',14)} Agregar producto aquí</button>
                </div>
              `;
            }).join('')}
            ${directProducts.map(p=>productRowHTML(p)).join('')}
            <div class="cat-actions-row">
              <button class="btn btn-secondary btn-sm" onclick="openProductModal(null,'${cat.id}',null)">${icon('plus',14)} Producto en ${cat.name}</button>
              <button class="btn btn-ghost btn-sm" onclick="openCategoryModal('productCategories',null,'${cat.id}')">${icon('plus',14)} Subcategoría</button>
            </div>
          </div>
        `;
      }).join('')}
      ${uncategorized.length?`
        <div class="section-title">Sin categoría</div>
        <div class="card">${uncategorized.map(p=>productRowHTML(p)).join('')}</div>
      `:''}
    `}
  `;
}
function productRowHTML(p){
  const lowStock=(p.quantity||0)<=(p.lowStockThreshold||3);
  return `
    <div class="list-row" style="cursor:pointer" onclick="openProductModal(${JSON.stringify(p).replace(/"/g,'&quot;')})">
      <div class="list-row-avatar">${p.photo?`<img src="${p.photo}">`:icon('box',18)}</div>
      <div class="list-row-body">
        <div class="list-row-title">${p.name}</div>
        <div class="list-row-sub">
          <span class="${lowStock?'low-stock':''}">Stock: ${p.quantity||0}</span>
          ${p.code?` · ${p.code}`:''}
        </div>
      </div>
      <div class="list-row-end"><div style="font-weight:700">${fmtCUP(p.salePrice)}</div></div>
    </div>
  `;
}
async function openProductModal(existing=null,categoryId=null,subcategoryId=null,onSaved=null){
  const categories=await dbGetAll('productCategories');
  openModal(`
    <h3 style="font-family:var(--font-display); font-size:var(--text-lg); margin-bottom:var(--sp-5)">
      ${existing?'Editar producto':'Nuevo producto'}
    </h3>
    <div class="field">
      <label>Fotografía</label>
      <div class="photo-upload" id="pf-photo-preview">${existing?.photo?`<img src="${existing.photo}">`:icon('camera',26)}</div>
      <input type="file" accept="image/*" id="pf-photo-input" style="display:none">
      <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="document.getElementById('pf-photo-input').click()">Elegir foto</button>
    </div>
    <div class="field">
      <label>Nombre <span class="required">*</span></label>
      <input type="text" id="pf-name" value="${existing?.name||''}" placeholder="Ej. Esmalte rojo Ruby">
    </div>
    <div class="field">
      <label>Categoría</label>
      <select id="pf-category">
        <option value="">Sin categoría</option>
        ${categories.filter(c=>!c.parentId).map(c=>`<option value="${c.id}" ${(existing?.categoryId||categoryId)===c.id?'selected':''}>${c.name}</option>`).join('')}
      </select>
    </div>
    <div class="field" id="pf-subcategory-field">
      <label>Subcategoría</label>
      <select id="pf-subcategory">
        <option value="">Ninguna</option>
      </select>
    </div>
    <div class="field">
      <label>Descripción</label>
      <textarea id="pf-desc">${existing?.description||''}</textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Precio de compra (CUP)</label>
        <input type="number" id="pf-buy" value="${existing?.purchasePrice||''}">
      </div>
      <div class="field">
        <label>Precio de venta (CUP)</label>
        <input type="number" id="pf-sell" value="${existing?.salePrice||''}">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Cantidad en stock</label>
        <input type="number" id="pf-qty" value="${existing?.quantity??0}">
      </div>
      <div class="field">
        <label>Código</label>
        <input type="text" id="pf-code" value="${existing?.code||''}">
      </div>
    </div>
    <div class="field">
      <label>Estado</label>
      <div class="chip-group" id="pf-status">
        <button type="button" class="chip ${(existing?.status||'active')==='active'?'active':''}" data-v="active">Activo</button>
        <button type="button" class="chip ${existing?.status==='inactive'?'active':''}" data-v="inactive">Inactivo</button>
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="pf-save">${icon('check',18)} Guardar producto</button>
    ${existing?`<button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="deleteProduct('${existing.id}')">${icon('trash',18)} Eliminar producto</button>`:''}
  `);
  document.querySelectorAll('#pf-status .chip').forEach(chip=>{
    chip.onclick=()=>{document.querySelectorAll('#pf-status .chip').forEach(c=>c.classList.remove('active')); chip.classList.add('active');};
  });
  function populateProductSubcategories(selectedCatId,selectedSubId){
    const subSelect=document.getElementById('pf-subcategory');
    const subs=categories.filter(c=>c.parentId===selectedCatId);
    subSelect.innerHTML='<option value="">Ninguna</option>'+
      subs.map(s=>`<option value="${s.id}" ${selectedSubId===s.id?'selected':''}>${s.name}</option>`).join('');
    document.getElementById('pf-subcategory-field').style.display=subs.length?'block':'none';
  }
  populateProductSubcategories(existing?.categoryId||categoryId||'', existing?.subcategoryId||subcategoryId||'');
  document.getElementById('pf-category').onchange=(e)=>populateProductSubcategories(e.target.value,'');

  let newPhoto=existing?.photo||null;
  document.getElementById('pf-photo-input').onchange=async(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    newPhoto=await compressImage(file);
    document.getElementById('pf-photo-preview').innerHTML=`<img src="${newPhoto}">`;
  };
  document.getElementById('pf-save').onclick=async()=>{
    const name=document.getElementById('pf-name').value.trim();
    if(!name){ toast('El nombre es obligatorio','error'); return; }
    const product={
      id:existing?.id||uid(),
      name,
      categoryId:document.getElementById('pf-category').value||null,
      subcategoryId:document.getElementById('pf-subcategory').value||null,
      description:document.getElementById('pf-desc').value.trim(),
      purchasePrice:parseFloat(document.getElementById('pf-buy').value)||0,
      salePrice:parseFloat(document.getElementById('pf-sell').value)||0,
      quantity:parseInt(document.getElementById('pf-qty').value)||0,
      code:document.getElementById('pf-code').value.trim(),
      status:document.querySelector('#pf-status .chip.active')?.dataset.v||'active',
      photo:newPhoto,
      lowStockThreshold:existing?.lowStockThreshold||3,
      createdAt:existing?.createdAt||nowISO()
    };
    await dbPut('products',product);
    closeModal();
    toast(existing?'Producto actualizado':'Producto creado','success');
    if(onSaved) onSaved(product);
    else renderRoute();
  };
}
async function deleteProduct(id){
  const product=await dbGet('products',id);
  const ok=await confirmDialog(`Se moverá "${product.name}" a la papelera.`,{title:'Eliminar producto',danger:true});
  if(!ok) return;
  await moveToTrash('products',product);
  closeModal();
  toast('Producto movido a la papelera','success');
  renderRoute();
}

async function renderCompras(container){
  setHeader('Compras',{back:true,actions:`<button class="btn-icon primary" onclick="openPurchaseModal()">${icon('plus',20)}</button>`});
  const purchases=(await dbGetAll('purchases')).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const totalMonth=purchases.filter(p=>new Date(p.date)>=startOfMonth(new Date())).reduce((a,p)=>a+(p.cost||0),0);

  container.innerHTML=`
    <div class="stat-card" style="margin-bottom:14px">
      <div class="stat-label">Compras del mes</div>
      <div class="stat-value">${fmtCUP(totalMonth)}</div>
      <div class="stat-usd">${fmtUSD(cupToUsd(totalMonth))}</div>
    </div>
    ${purchases.length===0?`
      <div class="empty-state">
        <div class="empty-icon">${icon('shopping-bag',28)}</div>
        <h4>Sin compras registradas</h4>
        <p>Registra la mercancía que compras para reponer inventario.</p>
      </div>
    `:`
      <div class="card">
        ${purchases.map(p=>`
          <div class="list-row" style="cursor:pointer" onclick="openPurchaseModal(${JSON.stringify(p).replace(/"/g,'&quot;')})">
            <div class="list-row-body">
              <div class="list-row-title">${p.productName}</div>
              <div class="list-row-sub">${p.supplier||'Sin proveedor'} · ${fmtDateShort(p.date)}</div>
            </div>
            <div class="list-row-end"><div style="font-weight:700">${fmtCUP(p.cost)}</div></div>
          </div>
        `).join('')}
      </div>
    `}
  `;
}
async function openPurchaseModal(existing=null){
  const products=await dbGetAll('products');
  openModal(`
    <h3 style="font-family:var(--font-display); font-size:var(--text-lg); margin-bottom:var(--sp-5)">
      ${existing?'Editar compra':'Nueva compra'}
    </h3>
    <div class="field">
      <label>Producto</label>
      <select id="pu-product">
        <option value="">Producto libre (no vinculado)</option>
        ${products.map(p=>`<option value="${p.id}" data-name="${p.name}" ${existing?.productId===p.id?'selected':''}>${p.name}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Nombre (si es libre) <span class="required">*</span></label>
      <input type="text" id="pu-name" value="${existing?.productName||''}" placeholder="Ej. Esmaltes surtidos">
    </div>
    <div class="field">
      <label>Proveedor</label>
      <input type="text" id="pu-supplier" value="${existing?.supplier||''}">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Costo total (CUP) <span class="required">*</span></label>
        <input type="number" id="pu-cost" value="${existing?.cost||''}">
      </div>
      <div class="field">
        <label>Cantidad</label>
        <input type="number" id="pu-qty" value="${existing?.quantity||1}">
      </div>
    </div>
    <div class="field">
      <label>Fecha</label>
      <input type="date" id="pu-date" value="${(existing?new Date(existing.date):new Date()).toISOString().slice(0,10)}">
    </div>
    <div class="field">
      <label>Notas</label>
      <textarea id="pu-notes">${existing?.notes||''}</textarea>
    </div>
    <button class="btn btn-primary btn-block" id="pu-save">${icon('check',18)} Guardar compra</button>
    ${existing?`<button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="deletePurchase('${existing.id}')">${icon('trash',18)} Eliminar</button>`:''}
  `);
  document.getElementById('pu-save').onclick=async()=>{
    const cost=parseFloat(document.getElementById('pu-cost').value);
    if(!cost || cost<=0){ toast('El costo es obligatorio','error'); return; }
    const productOpt=document.getElementById('pu-product').selectedOptions[0];
    const name=document.getElementById('pu-name').value.trim()||productOpt?.dataset.name;
    if(!name){ toast('Indica un nombre de producto','error'); return; }
    const purchase={
      id:existing?.id||uid(),
      productId:document.getElementById('pu-product').value||null,
      productName:name,
      supplier:document.getElementById('pu-supplier').value.trim(),
      cost, quantity:parseInt(document.getElementById('pu-qty').value)||1,
      date:new Date(document.getElementById('pu-date').value).toISOString(),
      notes:document.getElementById('pu-notes').value.trim(),
      createdAt:existing?.createdAt||nowISO()
    };
    await dbPut('purchases',purchase);
    closeModal();
    toast(existing?'Compra actualizada':'Compra registrada','success');
    renderRoute();
  };
}
async function deletePurchase(id){
  const ok=await confirmDialog('Se eliminará este registro de compra.',{title:'Eliminar compra',danger:true});
  if(!ok) return;
  await dbDelete('purchases',id);
  closeModal();
  toast('Compra eliminada','success');
  renderRoute();
}

let salesSearchTerm='';
async function renderHistorialVentas(container){
  setHeader('Historial de ventas',{back:true});
  const sales=(await dbGetAll('sales')).sort((a,b)=>new Date(b.date)-new Date(a.date));

  const filtered=salesSearchTerm?sales.filter(s=>{
    const term=salesSearchTerm.toLowerCase();
    return (s.clientName||'').toLowerCase().includes(term) ||
           fmtDate(s.date).toLowerCase().includes(term) ||
           (s.items||[]).some(i=>i.name.toLowerCase().includes(term));

  const totalShown=filtered.reduce((a,s)=>a+s.total,0);

  container.innerHTML=`

      <div class="empty-state"><p>Sin ventas ${salesSearchTerm?'que coincidan':'registradas aún'}</p></div>

        ${filtered.map(s=>`
          <div class="list-row" style="cursor:pointer" onclick="openSaleDetail('${s.id}')">
