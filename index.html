/* ================================================================
   VISTA: ESTADÍSTICAS (punto 15 del original)
   ================================================================
   Gráficos dibujados en <canvas> nativo — sin librerías externas,
   cumpliendo el requisito "sin dependencias" del punto 2.
   ================================================================ */
let statsPeriod='month'; // day|week|month|year

async function renderEstadisticas(container){
  setHeader('Estadísticas',{back:true});
  const sales=await dbGetAll('sales');
  const allExpenses=[...(await dbGetAll('expenses')),...(await dbGetAll('purchases')).map(p=>({amount:p.cost,date:p.date}))];
  const clients=await dbGetAll('clients');

  const now=new Date();
  const periodStart={
    day:startOfDay(now), week:startOfWeek(now), month:startOfMonth(now), year:startOfYear(now)
  }[statsPeriod];
  const periodSales=sales.filter(s=>new Date(s.date)>=periodStart);
  const periodExpenses=allExpenses.filter(e=>new Date(e.date)>=periodStart);

  const revenue=periodSales.reduce((a,s)=>a+s.total,0);
  const profit=periodSales.reduce((a,s)=>a+s.profit,0);
  const expTotal=periodExpenses.reduce((a,e)=>a+(e.amount||0),0);
  const balance=profit-expTotal;
  const uniqueClientCount=new Set(periodSales.map(s=>s.clientId).filter(Boolean)).size;
  const avgPerClient=periodSales.length?revenue/(uniqueClientCount||periodSales.length):0;
  const avgDaily=revenue/Math.max(1,daysBetween(periodStart,now));

  const newClients=clients.filter(c=>new Date(c.createdAt)>=periodStart).length;
  const frequentClients=clients.filter(c=>{
    const cSales=sales.filter(s=>s.clientId===c.id);
    return cSales.length>=3;
  }).length;

  // Últimos 7 días para gráfico de líneas
  const last7=Array.from({length:7},(_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-(6-i));
    const daySales=sales.filter(s=>isSameDay(s.date,d));
    return {label:d.toLocaleDateString('es-CU',{weekday:'short'}),value:daySales.reduce((a,s)=>a+s.total,0)};
  });

  // Servicios y productos más vendidos (todo el período)
  const svcCount={},prodCount={},catCount={};
  const categories=await dbGetAll('categories');
  const services=await dbGetAll('services');
  periodSales.forEach(s=>(s.items||[]).forEach(it=>{
    if(it.type==='service'){ svcCount[it.name]=(svcCount[it.name]||0)+1; }
    if(it.type==='product'){ prodCount[it.name]=(prodCount[it.name]||0)+(it.qty||1); }
  }));
  const topSvc=Object.entries(svcCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topProd=Object.entries(prodCount).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // Comparación entre meses (últimos 6)
  const last6Months=Array.from({length:6},(_,i)=>{
    const d=new Date(); d.setMonth(d.getMonth()-(5-i)); d.setDate(1);
    const monthEnd=new Date(d.getFullYear(),d.getMonth()+1,0,23,59,59);
    const mSales=sales.filter(s=>{const sd=new Date(s.date); return sd>=d && sd<=monthEnd;});
    return {label:d.toLocaleDateString('es-CU',{month:'short'}),value:mSales.reduce((a,s)=>a+s.total,0)};
  });

  container.innerHTML=`
    <div class="segmented" style="margin-bottom:16px">
      ${[['day','Día'],['week','Semana'],['month','Mes'],['year','Año']].map(([k,l])=>`
        <button class="${statsPeriod===k?'active':''}" onclick="statsPeriod='${k}'; renderRoute();">${l}</button>
      `).join('')}
    </div>

    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Ingresos</div><div class="stat-value">${fmtCUP(revenue)}</div><div class="stat-usd">${fmtUSD(cupToUsd(revenue))}</div></div>
      <div class="stat-card"><div class="stat-label">Ganancia</div><div class="stat-value" style="color:var(--success)">${fmtCUP(profit)}</div><div class="stat-usd">${fmtUSD(cupToUsd(profit))}</div></div>
      <div class="stat-card"><div class="stat-label">Gastos</div><div class="stat-value" style="color:var(--danger)">${fmtCUP(expTotal)}</div><div class="stat-usd">${fmtUSD(cupToUsd(expTotal))}</div></div>
      <div class="stat-card"><div class="stat-label">Balance</div><div class="stat-value">${fmtCUP(balance)}</div><div class="stat-usd">${fmtUSD(cupToUsd(balance))}</div></div>
    </div>

    <div class="section-title">Ventas — últimos 7 días</div>
    <div class="card"><canvas id="chart-week" width="600" height="200" style="width:100%; height:180px"></canvas></div>

    <div class="section-title">Comparación mensual</div>
    <div class="card"><canvas id="chart-months" width="600" height="200" style="width:100%; height:180px"></canvas></div>

    <div class="stat-grid" style="margin-top:16px">
      <div class="stat-card"><div class="stat-label">Clientes nuevos</div><div class="stat-value">${newClients}</div></div>
      <div class="stat-card"><div class="stat-label">Clientes frecuentes</div><div class="stat-value">${frequentClients}</div></div>
      <div class="stat-card"><div class="stat-label">Promedio por cliente</div><div class="stat-value">${fmtCUP(avgPerClient)}</div></div>
      <div class="stat-card"><div class="stat-label">Promedio diario</div><div class="stat-value">${fmtCUP(avgDaily)}</div></div>
    </div>

    <div class="section-title">Servicios más vendidos</div>
    ${topSvc.length===0?`<div class="empty-state" style="padding:20px"><p>Sin datos en este período</p></div>`:`
      <div class="card">${topSvc.map(([n,c],i)=>rankRow(n,c,i,topSvc[0][1])).join('')}</div>
    `}

    <div class="section-title">Productos más vendidos</div>
    ${topProd.length===0?`<div class="empty-state" style="padding:20px"><p>Sin datos en este período</p></div>`:`
      <div class="card">${topProd.map(([n,c],i)=>rankRow(n,c,i,topProd[0][1])).join('')}</div>
    `}
  `;

  drawBarChart('chart-week',last7);
  drawBarChart('chart-months',last6Months,true);
}
function daysBetween(a,b){ return Math.max(1,Math.round((b-a)/(1000*60*60*24))); }
function rankRow(name,count,index,maxCount){
  const pct=(count/maxCount)*100;
  return `
    <div style="padding:8px 0">
      <div style="display:flex; justify-content:space-between; font-size:var(--text-sm); margin-bottom:5px">
        <span style="font-weight:600">${name}</span><span>${count}</span>
      </div>
      <div style="height:6px; background:var(--surface-2); border-radius:var(--r-full)">
        <div style="height:100%; width:${pct}%; background:var(--primary); border-radius:var(--r-full)"></div>
      </div>
    </div>`;
}

/* Gráfico de barras simple en Canvas — responsive, sin dependencias */
function drawBarChart(canvasId,data,showCurrency){
  const canvas=document.getElementById(canvasId);
  if(!canvas) return;
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr; canvas.height=rect.height*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const W=rect.width, H=rect.height;
  ctx.clearRect(0,0,W,H);

  const max=Math.max(...data.map(d=>d.value),1);
  const barW=W/data.length*0.5;
  const gap=W/data.length;
  const textColor=getComputedStyle(document.documentElement).getPropertyValue('--text-soft').trim();
  const primary=getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();

  data.forEach((d,i)=>{
    const barH=(d.value/max)*(H-36);
    const x=gap*i+(gap-barW)/2;
    const y=H-barH-20;
    ctx.fillStyle=primary;
    roundRect(ctx,x,y,barW,barH,4);
    ctx.fill();
    ctx.fillStyle=textColor;
    ctx.font='11px Inter, sans-serif';
    ctx.textAlign='center';
    ctx.fillText(d.label,x+barW/2,H-6);
  });
}
function roundRect(ctx,x,y,w,h,r){
  h=Math.max(h,2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

async function confirmResetApp(){
  const ok=await confirmDialog('Se borrarán TODOS los datos de la aplicación de forma permanente: clientes, ventas, citas, productos, todo. No hay forma de recuperarlos después.',{title:'¿Restablecer aplicación?',danger:true});
  if(!ok) return;
  const ok2=await confirmDialog('Esta es tu última oportunidad. ¿Seguro que quieres continuar?',{title:'Confirmación final',danger:true});
  if(!ok2) return;

  toast('Borrando datos…','default',1500);

  // IMPORTANTE: la conexión abierta a IndexedDB (variable global "db")
  // bloquea el borrado de la base de datos hasta que se cierre. Sin este
  // paso, deleteDatabase() se queda esperando indefinidamente (evento
  // "blocked") y nunca llega a completarse, aunque el código siga
  // corriendo — por eso antes parecía funcionar pero no borraba nada.
  if(db){
    db.close();
    db=null;
  }

  try{
    await new Promise((resolve,reject)=>{
      const req=indexedDB.deleteDatabase(DB_NAME);
      req.onsuccess=()=>resolve();
      req.onerror=()=>reject(req.error);
      req.onblocked=()=>{
        // Si sigue bloqueado por otra pestaña/instancia abierta, lo
        // intentamos igual tras recargar, en vez de dejarlo colgado.
        resolve();
      };
    });
    toast('Aplicación restablecida','success');
  }catch(err){
    toast('No se pudo borrar completamente. Recargando…','error');
  }
  setTimeout(()=>location.reload(),900);
}

/* ================================================================
   RESPALDOS — punto 17: exportar/importar TODA la información
   ================================================================ */
const ALL_STORES=['config','categories','services','productCategories','products','clients','appointments','sales','purchases','expenses','notes','noteCategories','photos','albums','trash'];

async function exportBackup(){
  toast('Generando respaldo…','default',1800);
  const backup={version:1,exportedAt:nowISO(),data:{}};
  for(const store of ALL_STORES){
    backup.data[store]=await dbGetAll(store);
  }
  const blob=new Blob([JSON.stringify(backup)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`respaldo_${CONFIG.businessName.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Respaldo exportado','success');
}
async function importBackup(e){
  const file=e.target.files[0];
  if(!file) return;
  const ok=await confirmDialog('Importar un respaldo reemplazará todos los datos actuales por los del archivo. ¿Continuar?',{title:'Restaurar datos',danger:true});
  if(!ok) return;
  try{
    const text=await file.text();
    const backup=JSON.parse(text);
    if(!backup.data) throw new Error('Formato inválido');
    for(const store of ALL_STORES){
      if(!backup.data[store]) continue;
      const objStore=tx(store,'readwrite');
      await new Promise((res)=>{ const c=objStore.clear(); c.onsuccess=res; c.onerror=res; });
      for(const item of backup.data[store]){
        await dbPut(store,item);
      }
    }
    toast('Datos restaurados correctamente','success');
    setTimeout(()=>location.reload(),1000);
  }catch(err){
    toast('El archivo de respaldo no es válido','error');
  }
}

  const manifest={
    name:CONFIG?.businessName||'Nails Studio',
    short_name:(CONFIG?.businessName||'Nails Studio').slice(0,12),
    description:'Gestión integral de negocio de uñas — 100% offline',
    start_url:'./',
    display:'standalone',
    orientation:'portrait-primary',
    background_color:CONFIG?.primaryColor||'#C9184A',
    theme_color:CONFIG?.primaryColor||'#C9184A',
    icons:[
      {src:toDataUrl(icon192),sizes:'192x192',type:'image/svg+xml'},
      {src:toDataUrl(icon512),sizes:'512x512',type:'image/svg+xml'}
    ]
  };
  const manifestBlob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
  const manifestUrl=URL.createObjectURL(manifestBlob);
  document.getElementById('app-manifest').setAttribute('href',manifestUrl);
  document.getElementById('app-favicon').setAttribute('href',toDataUrl(icon192));
  document.getElementById('app-apple-icon').setAttribute('href',toDataUrl(icon192));
}

/* ================================================================
   MÓDULO: SERVICE WORKER (embebido como Blob — un solo archivo)
   ================================================================
   Habilita: funcionamiento 100% offline (punto 1) y notificaciones
   locales de recordatorio de citas (mejora #4).
   ================================================================ */
const SW_SOURCE = `
  const CACHE_NAME = 'nails-studio-v1';
  self.addEventListener('install', (e) => { self.skipWaiting(); });
  self.addEventListener('activate', (e) => { self.clients.claim(); });
  self.addEventListener('fetch', (e) => {
    // App de una sola página: siempre servir desde caché de red si está disponible,
    // y si no hay red, permitir que el navegador use su caché normal.
    e.respondWith(
      fetch(e.request).catch(() => caches.match(e.request))
    );
  });
  self.addEventListener('notificationclick', (e) => {
    e.notification.close();
    e.waitUntil(self.clients.openWindow('./'));
  });
`;

function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  try{
    const blob=new Blob([SW_SOURCE],{type:'application/javascript'});
    const swUrl=URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(()=>{
      // Si el registro falla (ej. restricciones del entorno), la app sigue
      // funcionando normalmente sin Service Worker.
    });
  }catch(err){ /* silencioso: no bloquea el uso de la app */ }
}

/* ================================================================
   MÓDULO: RECORDATORIOS DE CITAS (mejora #4)
   ================================================================ */
async function checkAppointmentReminders(){
  if(!('Notification' in window)) return;
  if(Notification.permission!=='granted') return;
  const appointments=await dbGetAll('appointments');
  const now=Date.now();
  const hoursBefore=CONFIG?.reminderHoursBefore||2;
  appointments
    .filter(a=>a.status==='confirmada' && !a.reminderSent)
    .forEach(async a=>{
      const apptTime=new Date(a.date).getTime();
      const diff=apptTime-now;
      if(diff>0 && diff<=hoursBefore*60*60*1000){
        new Notification(`Cita próxima: ${a.clientName}`,{
          body:`${a.serviceName||'Servicio'} a las ${fmtTime(a.date)}`
        });
        a.reminderSent=true;
        await dbPut('appointments',a);
      }
    });
}
async function requestNotificationPermission(){
  if('Notification' in window && Notification.permission==='default'){
    try{ await Notification.requestPermission(); }catch(e){}
  }
}

/* ================================================================
   BOOTSTRAP — inicialización de la aplicación
   ================================================================ */
async function initApp(){
  try{
    await openDB();
    await loadConfig();
    updateManifest();
    registerServiceWorker();
    await purgeOldTrash();
    requestNotificationPermission();
    setInterval(checkAppointmentReminders,5*60*1000); // revisar cada 5 min
    checkAppointmentReminders();

    renderShell();
    const hash=window.location.hash.replace('#','');
    const [route,id]=hash.split('/');
    currentRoute=route||'dashboard';
    currentParams=id?{id}:{};
    renderRoute();

    document.getElementById('boot-screen').style.opacity='0';
    setTimeout(()=>document.getElementById('boot-screen').remove(),350);
  }catch(err){
    console.error('Error al iniciar la aplicación:',err);
    document.getElementById('boot-screen').innerHTML=`
      <div style="text-align:center; padding:0 24px">
        <div style="color:var(--danger); margin-bottom:12px">${icon('alert-triangle',32)}</div>
        <p style="color:var(--text-soft)">No se pudo iniciar la aplicación. Intenta recargar la página.</p>
      </div>`;
  }
}

document.addEventListener('DOMContentLoaded',initApp);
